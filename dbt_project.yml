name: airstats

profile: airstats

analysis-paths: ["analyses"]
seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  airstats:
    +schema: raw

models:
  airstats:
    +static_analysis: strict
    bronze:
      +materialized: view
analyses:
  +static_analysis: strict

