name: airstats

profile: airstats

asset-paths: ["assets"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  airstats:
    +schema: raw

snapshots:
  airstats:
    +schema: scd

on-run-start:
  - "create schema if not exists `{{ target.database }}.{{ target.schema }}`"
  - "create table if not exists `{{ target.database }}.{{ target.schema }}.audit_log` (model_name string, executed_at timestamp)"

models:
  airstats:
    +post-hook:
      - "insert into `{{ target.database }}.{{ target.schema }}.audit_log` values ('{{ this }}', current_timestamp())"
    +static_analysis: strict
    bronze:
      +materialized: view
    silver:
      +materialized: table

analyses:
  +static_analysis: strict

tests:
  +store_failures: true
  +schema: test_audit
#! https://github.com/zoltanctoth/dbt-capstone-project#part-5-staging-models-bronze-layer
