snapshots:
  - name: scd_silver_airports
    relation: ref('silver_airports')
    config:
      unique_key: airport_ident
      strategy: check
      check_cols:
        - airport_id
        - airport_ident
        - airport_type
        - airport_name
        - airport_lat
        - airport_long
        - continent
        - iso_country
        - iso_region
      hard_deletes: invalidate
